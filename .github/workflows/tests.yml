name: Tests

on:
  push:
    branches: [ main, refactor/complete-restructure ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        flake8 checkpcspecs --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 checkpcspecs --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Check code formatting with black
      run: |
        black --check checkpcspecs tests

    - name: Sort imports with isort
      run: |
        isort --check-only checkpcspecs tests

    - name: Type check with mypy
      run: |
        mypy checkpcspecs
      continue-on-error: true

    - name: Run unit tests
      run: |
        pytest tests/unit -v --cov=checkpcspecs --cov-report=xml --cov-report=term

    - name: Run integration tests
      run: |
        pytest tests/integration -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
